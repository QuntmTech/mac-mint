name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    # Signing secrets live in this environment; its required reviewers approve each release
    # and its deployment rule limits it to v* tags (docs/RELEASING.md).
    environment: release
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.DEVELOPER_ID_P12_PASSWORD != '' && secrets.DEVELOPER_ID_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      - name: Check tag matches Info.plist version
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          [[ "v$PLIST_VERSION" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME != Info.plist $PLIST_VERSION"; exit 1; }

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Only codesign (and security itself) may use the private key, not every app.
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize
        env:
          NO_OPEN: "1"
          MACMINT_ARCHS: "arm64 x86_64"
          REQUIRE_NOTARIZATION: ${{ env.HAS_SIGNING == 'true' && '1' || '0' }}
          REQUIRE_STYLED_INSTALLER: "1"
          SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build_app.sh

      - name: Validate packaged app
        id: mode
        run: |
          ./scripts/smoke_test.sh dist/MacMint.app
          EXPECTED_ARCHS="arm64 x86_64" REQUIRE_STYLED_INSTALLER=1 REQUIRE_NOTARIZATION="${{ env.HAS_SIGNING == 'true' && '1' || '0' }}" ./scripts/verify_installer.sh dist/MacMint.dmg
          if [[ "$HAS_SIGNING" == "true" ]]; then
            xcrun stapler validate dist/MacMint.app
            spctl --assess --type execute --verbose=2 dist/MacMint.app
          fi
          echo "signed=$HAS_SIGNING" >> "$GITHUB_OUTPUT"

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_SIGNING == 'true'
        with:
          node-version: '22'

      # Stable channel (docs/UPDATES.md): only Developer ID-signed, notarized builds are offered
      # to installed copies, through appcast.xml on the newest non-prerelease release.
      - name: Stable appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_TOOLS_URL: https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-for-Swift-Package-Manager.zip
          SPARKLE_TOOLS_SHA256: 17e28312b8e18ab7cdbbe09a6fb28cc55a5479ec6c371dbc07cdecd2a14fd959
        run: |
          if [[ "$HAS_SIGNING" != "true" ]]; then
            echo "Skipping appcast.xml: this build is not Developer ID-signed and notarized, so the stable update channel does not offer it."
            exit 0
          fi
          [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]] || { echo "::error::The SPARKLE_ED_PRIVATE_KEY secret is not set."; exit 1; }
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/sparkle.zip" "$SPARKLE_TOOLS_URL"
          echo "$SPARKLE_TOOLS_SHA256  $RUNNER_TEMP/sparkle.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/sparkle.zip" bin/sign_update -d "$RUNNER_TEMP/sparkle"
          PLIST=dist/MacMint.app/Contents/Info.plist
          BUILD=$(plutil -extract CFBundleVersion raw "$PLIST")
          SHORT_VERSION=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/MacMint.zip"
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2> /dev/null || true)
          NOTES=(--changes-file "$RUNNER_TEMP/changes.txt")
          if [[ -n "$PREVIOUS" ]]; then
            git log --no-merges --format=%s "$PREVIOUS..$GITHUB_SHA" > "$RUNNER_TEMP/changes.txt"
            NOTES+=(--since "$PREVIOUS")
          else
            git log --no-merges --format=%s -n 30 "$GITHUB_SHA" > "$RUNNER_TEMP/changes.txt"
          fi
          SIGNATURE=$(printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - -p dist/MacMint.zip)
          node scripts/sparkle_appcast.mjs generate --channel stable --version "$BUILD" --short-version "$SHORT_VERSION" \
            --url "$URL" --archive dist/MacMint.zip --signature "$SIGNATURE" "${NOTES[@]}" --keep 1 --output dist/appcast.xml
          xmllint --noout dist/appcast.xml
          node scripts/sparkle_appcast.mjs verify --appcast dist/appcast.xml --archive dist/MacMint.zip \
            --public-key "$(plutil -extract SUPublicEDKey raw "$PLIST")" --version "$BUILD" --url "$URL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-${{ github.ref_name }}
          path: |
            dist/MacMint.dmg
            dist/MacMint.dmg.sha256
            dist/MacMint.zip
            dist/MacMint.zip.sha256
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 7

  # The only job with a write token runs no repository code: it publishes the built artifact.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package-${{ github.ref_name }}
          path: dist

      - name: Verify package digests
        run: |
          for package in dist/MacMint.dmg dist/MacMint.zip; do
            EXPECTED=$(cat "$package.sha256")
            ACTUAL=$(sha256sum "$package" | awk '{print $1}')
            [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ && "$ACTUAL" == "$EXPECTED" ]] || { echo "Digest mismatch for $package"; exit 1; }
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIGNING: ${{ needs.build.outputs.signed }}
        run: |
          SIGNED="ad-hoc signed (not notarized)"
          [[ "$HAS_SIGNING" == "true" ]] && SIGNED="Developer ID signed and notarized"
          PRERELEASE=""
          [[ "$HAS_SIGNING" == "true" ]] || PRERELEASE="--prerelease"
          ASSETS=(dist/MacMint.dmg dist/MacMint.dmg.sha256 dist/MacMint.zip dist/MacMint.zip.sha256)
          if [[ -f dist/appcast.xml ]]; then
            [[ "$HAS_SIGNING" == "true" ]] || { echo "Refusing to publish appcast.xml for a build that is not Developer ID-signed."; exit 1; }
            ASSETS+=(dist/appcast.xml)
          else
            echo "No appcast.xml: the stable update channel does not offer this build."
          fi
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" $PRERELEASE \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MacMint ${GITHUB_REF_NAME#v}" \
            --notes "Build: $SIGNED. Download MacMint.dmg, open it, drag MacMint to Applications, then open the installed copy. Requires macOS 14+. The app supports Apple Silicon and Intel. Local inspection works before sign-in; connect the same account as your purchase. DMG SHA-256: $(cat dist/MacMint.dmg.sha256). ZIP is an alternative archive."
