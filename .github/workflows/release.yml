name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    # Signing secrets live in this environment; its required reviewers approve each release
    # and its deployment rule limits it to v* tags (docs/RELEASING.md).
    environment: release
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.DEVELOPER_ID_P12_PASSWORD != '' && secrets.DEVELOPER_ID_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }

      - name: Check tag matches Info.plist version
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          [[ "v$PLIST_VERSION" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME != Info.plist $PLIST_VERSION"; exit 1; }

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Only codesign (and security itself) may use the private key, not every app.
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize
        env:
          NO_OPEN: "1"
          REQUIRE_NOTARIZATION: ${{ env.HAS_SIGNING == 'true' && '1' || '0' }}
          SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build_app.sh

      - name: Validate packaged app
        id: mode
        run: |
          ./scripts/smoke_test.sh dist/MacMint.app
          if [[ "$HAS_SIGNING" == "true" ]]; then
            xcrun stapler validate dist/MacMint.app
            spctl --assess --type execute --verbose=2 dist/MacMint.app
          fi
          echo "signed=$HAS_SIGNING" >> "$GITHUB_OUTPUT"

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-${{ github.ref_name }}
          path: |
            dist/MacMint.zip
            dist/MacMint.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # The only job with a write token runs no repository code: it publishes the built artifact.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package-${{ github.ref_name }}
          path: dist

      - name: Verify package digest
        run: |
          EXPECTED=$(cat dist/MacMint.zip.sha256)
          ACTUAL=$(sha256sum dist/MacMint.zip | awk '{print $1}')
          [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ && "$ACTUAL" == "$EXPECTED" ]]

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIGNING: ${{ needs.build.outputs.signed }}
        run: |
          SIGNED="ad-hoc signed (not notarized)"
          [[ "$HAS_SIGNING" == "true" ]] && SIGNED="Developer ID signed and notarized"
          PRERELEASE=""
          [[ "$HAS_SIGNING" == "true" ]] || PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/MacMint.zip dist/MacMint.zip.sha256 $PRERELEASE \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MacMint ${GITHUB_REF_NAME#v}" \
            --notes "Build: $SIGNED. SHA-256: $(cat dist/MacMint.zip.sha256)"
