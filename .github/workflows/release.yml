name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.DEVELOPER_ID_P12_PASSWORD != '' && secrets.DEVELOPER_ID_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Info.plist version
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          [[ "v$PLIST_VERSION" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME != Info.plist $PLIST_VERSION"; exit 1; }

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize
        env:
          NO_OPEN: "1"
          MACMINT_ARCHS: "arm64 x86_64"
          REQUIRE_NOTARIZATION: ${{ env.HAS_SIGNING == 'true' && '1' || '0' }}
          SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build_app.sh

      - name: Validate packaged app
        run: |
          ./scripts/smoke_test.sh dist/MacMint.app
          EXPECTED_ARCHS="arm64 x86_64" REQUIRE_NOTARIZATION="${{ env.HAS_SIGNING == 'true' && '1' || '0' }}" ./scripts/verify_installer.sh dist/MacMint.dmg
          if [[ "$HAS_SIGNING" == "true" ]]; then
            xcrun stapler validate dist/MacMint.app
            spctl --assess --type execute --verbose=2 dist/MacMint.app
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNED="ad-hoc signed (not notarized)"
          [[ "$HAS_SIGNING" == "true" ]] && SIGNED="Developer ID signed and notarized"
          PRERELEASE=""
          [[ "$HAS_SIGNING" == "true" ]] || PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/MacMint.dmg dist/MacMint.dmg.sha256 dist/MacMint.zip dist/MacMint.zip.sha256 $PRERELEASE \
            --title "MacMint ${GITHUB_REF_NAME#v}" \
            --notes "Build: $SIGNED. Download MacMint.dmg, open it, drag MacMint to Applications, then open the installed copy. Requires macOS 14+. The app supports Apple Silicon and Intel. Local inspection works before sign-in; connect the same account as your purchase. DMG SHA-256: $(cat dist/MacMint.dmg.sha256). ZIP is an alternative archive."
