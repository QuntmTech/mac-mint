name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Operating system and Swift version
        run: |
          sw_vers
          uname -m
          swift --version
      - name: Core tests
        run: swift test
        timeout-minutes: 7
        env:
          MACMINT_VOLUME_TESTS: "1"
      - name: Build desktop app
        run: swift build -c release --product MacMint
      - name: Package local app bundle
        run: NO_OPEN=1 ./scripts/build_app.sh
      - name: Normal startup, menu bar, idle CPU, and graceful Quit
        run: ./scripts/native_startup_test.sh dist/MacMint.app
        timeout-minutes: 4
      - name: Launch smoke test
        run: ./scripts/smoke_test.sh dist/MacMint.app
        env:
          MACMINT_SCREENSHOT_DIR: dist/screenshots
      - name: Upload native interface previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacMint-UI-${{ matrix.os }}-${{ github.sha }}
          path: dist/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MacMint-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/MacMint.zip
            dist/MacMint.zip.sha256
          retention-days: 14

  downloaded-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MacMint-${{ matrix.os }}-${{ github.sha }}
          path: candidate
      - name: Verify downloaded archive and extracted signature
        run: |
          EXPECTED=$(cat candidate/MacMint.zip.sha256)
          ACTUAL=$(shasum -a 256 candidate/MacMint.zip | awk '{print $1}')
          [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ && "$ACTUAL" == "$EXPECTED" ]]
          ditto -x -k candidate/MacMint.zip candidate/extracted
          codesign --verify --strict --verbose=2 candidate/extracted/MacMint.app
          ./scripts/smoke_test.sh candidate/extracted/MacMint.app
      - name: Normal startup from downloaded package
        run: ./scripts/native_startup_test.sh candidate/extracted/MacMint.app
        timeout-minutes: 4
