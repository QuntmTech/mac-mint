name: macOS build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Core tests
        run: swift test
      - name: Build desktop app
        run: swift build -c release --product MacMint
      - name: Package local app bundle
        run: NO_OPEN=1 ./scripts/build_app.sh
      - name: Launch smoke test
        run: ./scripts/smoke_test.sh dist/MacMint.app
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MacMint-${{ github.sha }}
          path: |
            dist/MacMint.zip
            dist/MacMint.zip.sha256
          retention-days: 14

  downloaded-package:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MacMint-${{ github.sha }}
          path: candidate
      - name: Verify downloaded archive and extracted signature
        run: |
          EXPECTED=$(cat candidate/MacMint.zip.sha256)
          ACTUAL=$(shasum -a 256 candidate/MacMint.zip | awk '{print $1}')
          [[ "$EXPECTED" =~ ^[a-f0-9]{64}$ && "$ACTUAL" == "$EXPECTED" ]]
          ditto -x -k candidate/MacMint.zip candidate/extracted
          codesign --verify --strict --verbose=2 candidate/extracted/MacMint.app
          ./scripts/smoke_test.sh candidate/extracted/MacMint.app
