[package]
name = "macmint"
version = "0.10.0"
description = "MacMint for Windows"
edition = "2021"
publish = false

[lib]
name = "macmint_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
macmint_core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
keyring = { version = "3", features = ["windows-native"] }

[target."cfg(windows)".dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
