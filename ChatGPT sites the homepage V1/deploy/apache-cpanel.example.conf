# Merge into .htaccess AFTER backing up the current account app.
# Replace the old MacMint SPA fallback; preserve existing HTTPS/cPanel rules.
# Required: the existing web/ app index is saved as account-app.html,
# with its /assets/ files retained. This is a reference, not an executed deploy.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteRule ^home2/?$ / [L,R=301]
  RewriteRule ^(login|signup|account|forgot-password|reset-password|verify-email)/?$ account-app.html [L]
  RewriteCond %{REQUEST_FILENAME} -f [OR]
  RewriteCond %{REQUEST_FILENAME} -d
  RewriteRule ^ - [L]
</IfModule>
DirectoryIndex index.html
ErrorDocument 404 /404.html
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  <FilesMatch "\.(html|txt|xml)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
</IfModule>
