# Routing fragment for the existing HTTPS vhost; adapt paths to your VPS.
# Keep TLS, certificate and account/backend settings from the live vhost.
# Both homepage files and the existing account SPA/assets share this docroot.
root /var/www/macmint;
index index.html;
location ~ ^/(login|signup|account|forgot-password|reset-password|verify-email)/?$ {
    try_files /account-app.html =404;
    add_header Cache-Control "no-cache";
}
location /_next/static/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location / {
    try_files $uri $uri.html $uri/ =404;
}
error_page 404 /404.html;
